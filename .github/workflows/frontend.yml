name: Build and Deploy Frontend

on:
  workflow_dispatch:

  # Uncomment this if you want automatic deployment
  # whenever you push to main.
  #
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: my-streamlit-app
  CONTAINER_NAME: my-streamlit-app
  CONTAINER_PORT: 8501

  # Backend container running on the SAME EC2 instance
  BACKEND_CONTAINER: my-spring-app
  DOCKER_NETWORK: app-network

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout source code
      # ============================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================
      # 2. Configure AWS credentials
      # ============================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================
      # 3. Test AWS credentials
      # ============================================

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity


      # ============================================
      # 4. Create ECR repository if it doesn't exist
      # ============================================

      - name: Create ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
          || aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"


      # ============================================
      # 5. Login to Amazon ECR
      # ============================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================
      # 6. Build Frontend Docker Image
      #
      # IMPORTANT:
      # Dockerfile is inside frontend/
      # ============================================

      - name: Build frontend Docker image
        working-directory: frontend
        run: |
          docker build \
            -t "$ECR_REPOSITORY:latest" \
            .


      # ============================================
      # 7. Tag Frontend Docker Image
      # ============================================

      - name: Tag frontend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # ============================================
      # 8. Push Frontend Image to ECR
      # ============================================

      - name: Push frontend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # ============================================
      # 9. Deploy Frontend to EC2
      # ============================================

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "========================================"
            echo "Starting frontend deployment"
            echo "========================================"


            # ========================================
            # Install Docker if not installed
            # ========================================

            echo "Checking Docker..."

            if ! command -v docker >/dev/null 2>&1
            then

              echo "Docker not found. Installing..."

              if command -v dnf >/dev/null 2>&1
              then

                sudo dnf update -y
                sudo dnf install -y docker

              elif command -v yum >/dev/null 2>&1
              then

                sudo yum update -y
                sudo yum install -y docker

              else

                echo "Unsupported Linux distribution."
                exit 1

              fi

              sudo systemctl enable docker
              sudo systemctl start docker

            else

              echo "Docker already installed."

            fi


            # ========================================
            # Start Docker
            # ========================================

            echo "Starting Docker..."

            sudo systemctl start docker


            # ========================================
            # Install AWS CLI if not installed
            # ========================================

            echo "Checking AWS CLI..."

            if ! command -v aws >/dev/null 2>&1
            then

              echo "AWS CLI not found. Installing..."

              if command -v dnf >/dev/null 2>&1
              then

                sudo dnf install -y awscli

              elif command -v yum >/dev/null 2>&1
              then

                sudo yum install -y awscli

              else

                echo "Unsupported Linux distribution."
                exit 1

              fi

            else

              echo "AWS CLI already installed."

            fi


            # ========================================
            # Display versions
            # ========================================

            echo "========================================"
            echo "Docker version"
            echo "========================================"

            sudo docker --version


            echo "========================================"
            echo "AWS CLI version"
            echo "========================================"

            aws --version


            # ========================================
            # Login to ECR
            #
            # EC2 IAM ROLE is used here.
            # No AWS keys are required on EC2.
            # ========================================

            echo "========================================"
            echo "Logging into ECR"
            echo "========================================"

            aws ecr get-login-password \
              --region ap-southeast-1 \
              | sudo docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}


            # ========================================
            # Create Docker network
            # ========================================

            echo "========================================"
            echo "Creating Docker network"
            echo "========================================"

            sudo docker network create app-network || true


            # ========================================
            # Check backend container
            # ========================================

            echo "========================================"
            echo "Checking backend container"
            echo "========================================"

            if sudo docker ps -a \
              --format '{{.Names}}' \
              | grep -q "^my-spring-app$"
            then

              echo "Backend container exists."

            else

              echo "WARNING: Backend container my-spring-app does not exist."

              echo "Make sure backend.yml has been deployed first."

            fi


            # ========================================
            # Connect backend to Docker network
            # ========================================

            echo "========================================"
            echo "Connecting backend to Docker network"
            echo "========================================"

            if sudo docker ps -a \
              --format '{{.Names}}' \
              | grep -q "^my-spring-app$"
            then

              sudo docker network connect \
                app-network \
                my-spring-app \
                2>/dev/null || true

            fi


            # ========================================
            # Pull latest frontend image
            # ========================================

            echo "========================================"
            echo "Pulling latest frontend image"
            echo "========================================"

            sudo docker pull \
              ${{ steps.login-ecr.outputs.registry }}/my-streamlit-app:latest


            # ========================================
            # Stop old frontend container
            # ========================================

            echo "========================================"
            echo "Stopping old frontend container"
            echo "========================================"

            sudo docker stop my-streamlit-app || true


            # ========================================
            # Remove old frontend container
            # ========================================

            echo "========================================"
            echo "Removing old frontend container"
            echo "========================================"

            sudo docker rm my-streamlit-app || true


            # ========================================
            # Start new frontend container
            # ========================================

            echo "========================================"
            echo "Starting Streamlit frontend"
            echo "========================================"

            sudo docker run -d \
              --name my-streamlit-app \
              --restart unless-stopped \
              --network app-network \
              -p 8501:8501 \
              -e API_URL="http://my-spring-app:8084" \
              ${{ steps.login-ecr.outputs.registry }}/my-streamlit-app:latest


            # ========================================
            # Wait for Streamlit
            # ========================================

            echo "Waiting for frontend to start..."

            sleep 10


            # ========================================
            # Container status
            # ========================================

            echo "========================================"
            echo "Running containers"
            echo "========================================"

            sudo docker ps


            # ========================================
            # Network status
            # ========================================

            echo "========================================"
            echo "Docker network"
            echo "========================================"

            sudo docker network inspect app-network


            # ========================================
            # Frontend logs
            # ========================================

            echo "========================================"
            echo "Frontend application logs"
            echo "========================================"

            sudo docker logs \
              --tail 50 \
              my-streamlit-app


            # ========================================
            # Deployment completed
            # ========================================

            echo "========================================"
            echo "Frontend deployment completed"
            echo "========================================"

            echo "Access Streamlit at:"
            echo "http://YOUR-EC2-PUBLIC-IP:8501"


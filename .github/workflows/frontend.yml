name: Build and Deploy Frontend

on:
  workflow_dispatch:

  # Uncomment for automatic deployment
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: my-streamlit-app
  CONTAINER_NAME: my-streamlit-app
  CONTAINER_PORT: 8501

  BACKEND_CONTAINER: my-spring-app
  DOCKER_NETWORK: app-network

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout source
      # ============================================

      - name: Checkout source
        uses: actions/checkout@v5


      # ============================================
      # 2. Configure AWS credentials
      # ============================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================
      # 3. Test AWS credentials
      # ============================================

      - name: Test AWS credentials
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity


      # ============================================
      # 4. Create ECR repository
      # ============================================

      - name: Create ECR repository
        run: |
          echo "Checking ECR repository..."

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1
          then
            echo "ECR repository already exists."

          else
            echo "Creating ECR repository..."

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION"

          fi


      # ============================================
      # 5. Login to ECR
      # ============================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================
      # 6. Verify frontend files
      # ============================================

      - name: Verify frontend files
        run: |
          echo "========================================"
          echo "Frontend directory"
          echo "========================================"

          ls -la frontend/

          echo "========================================"
          echo "Checking Dockerfile"
          echo "========================================"

          test -f frontend/Dockerfile

          echo "Frontend Dockerfile found."


      # ============================================
      # 7. Build frontend Docker image
      #
      # IMPORTANT:
      # Dockerfile is:
      #
      # frontend/Dockerfile
      #
      # ============================================

      - name: Build frontend Docker image
        working-directory: frontend
        run: |
          echo "Building frontend Docker image..."

          docker build \
            --pull \
            -t "$ECR_REPOSITORY:latest" \
            .

          echo "Frontend image built successfully."


      # ============================================
      # 8. Tag image
      # ============================================

      - name: Tag frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Tagging image..."

          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # ============================================
      # 9. Push image to ECR
      # ============================================

      - name: Push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Pushing frontend image to ECR..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Frontend image pushed successfully."


      # ============================================
      # 10. Deploy to EC2
      # ============================================

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "========================================"
            echo "FRONTEND DEPLOYMENT STARTED"
            echo "========================================"


            # ========================================
            # 11. Check / Install Docker
            # ========================================

            echo "Checking Docker..."

            if ! command -v docker >/dev/null 2>&1
            then

              echo "Docker is not installed."

              if command -v dnf >/dev/null 2>&1
              then

                echo "Installing Docker using dnf..."

                sudo dnf install -y docker

              elif command -v yum >/dev/null 2>&1
              then

                echo "Installing Docker using yum..."

                sudo yum install -y docker

              else

                echo "ERROR: Unsupported Linux distribution."
                exit 1

              fi

            else

              echo "Docker is already installed."

            fi


            # ========================================
            # 12. Start Docker
            # ========================================

            echo "Starting Docker..."

            sudo systemctl enable docker
            sudo systemctl start docker


            # ========================================
            # 13. Verify Docker
            # ========================================

            echo "Docker version:"

            sudo docker --version


            # ========================================
            # 14. Check / Install AWS CLI
            # ========================================

            echo "Checking AWS CLI..."

            if ! command -v aws >/dev/null 2>&1
            then

              echo "AWS CLI is not installed."

              if command -v dnf >/dev/null 2>&1
              then

                sudo dnf install -y awscli

              elif command -v yum >/dev/null 2>&1
              then

                sudo yum install -y awscli

              else

                echo "ERROR: Cannot install AWS CLI."
                exit 1

              fi

            else

              echo "AWS CLI is already installed."

            fi


            # ========================================
            # 15. Verify AWS CLI
            # ========================================

            echo "AWS CLI version:"

            aws --version


            # ========================================
            # 16. Verify EC2 IAM Role
            # ========================================

            echo "========================================"
            echo "Checking EC2 IAM role"
            echo "========================================"

            aws sts get-caller-identity


            # ========================================
            # 17. Login to ECR
            #
            # EC2 IAM ROLE provides credentials.
            # No AWS secrets are placed on EC2.
            # ========================================

            echo "========================================"
            echo "Logging into ECR"
            echo "========================================"

            aws ecr get-login-password \
              --region ap-southeast-1 \
              | sudo docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}


            # ========================================
            # 18. Create Docker network
            # ========================================

            echo "========================================"
            echo "Creating Docker network"
            echo "========================================"

            if sudo docker network inspect app-network >/dev/null 2>&1
            then

              echo "Docker network already exists."

            else

              echo "Creating Docker network..."

              sudo docker network create app-network

            fi


            # ========================================
            # 19. Check backend container
            # ========================================

            echo "========================================"
            echo "Checking backend container"
            echo "========================================"

            if sudo docker ps -a \
              --format '{{.Names}}' \
              | grep -q "^my-spring-app$"
            then

              echo "Backend container found."

            else

              echo ""
              echo "ERROR: Backend container my-spring-app was not found."
              echo ""
              echo "Please deploy backend.yml first."
              echo ""

              exit 1

            fi


            # ========================================
            # 20. Check backend container status
            # ========================================

            echo "Backend container status:"

            sudo docker ps \
              --filter "name=my-spring-app"


            # ========================================
            # 21. Connect backend to network
            # ========================================

            echo "========================================"
            echo "Connecting backend to app-network"
            echo "========================================"

            sudo docker network connect \
              app-network \
              my-spring-app \
              2>/dev/null || true

            echo "Backend network configuration:"

            sudo docker inspect \
              my-spring-app \
              --format '{{json .NetworkSettings.Networks}}'


            # ========================================
            # 22. Pull frontend image
            # ========================================

            echo "========================================"
            echo "Pulling frontend image"
            echo "========================================"

            sudo docker pull \
              ${{ steps.login-ecr.outputs.registry }}/my-streamlit-app:latest


            # ========================================
            # 23. Stop old frontend container
            # ========================================

            echo "========================================"
            echo "Stopping old frontend container"
            echo "========================================"

            sudo docker stop my-streamlit-app || true


            # ========================================
            # 24. Remove old frontend container
            # ========================================

            echo "========================================"
            echo "Removing old frontend container"
            echo "========================================"

            sudo docker rm my-streamlit-app || true


            # ========================================
            # 25. Start frontend container
            # ========================================

            echo "========================================"
            echo "Starting frontend container"
            echo "========================================"

            sudo docker run -d \
              --name my-streamlit-app \
              --restart unless-stopped \
              --network app-network \
              -p 8501:8501 \
              -e API_URL="http://my-spring-app:8084" \
              ${{ steps.login-ecr.outputs.registry }}/my-streamlit-app:latest


            # ========================================
            # 26. Wait for application
            # ========================================

            echo "Waiting for Streamlit..."

            sleep 10


            # ========================================
            # 27. Check frontend container
            # ========================================

            echo "========================================"
            echo "Frontend container status"
            echo "========================================"

            sudo docker ps \
              --filter "name=my-streamlit-app"


            # ========================================
            # 28. Check frontend logs
            # ========================================

            echo "========================================"
            echo "Frontend logs"
            echo "========================================"

            sudo docker logs \
              --tail 100 \
              my-streamlit-app


            # ========================================
            # 29. Final network check
            # ========================================

            echo "========================================"
            echo "Docker network"
            echo "========================================"

            sudo docker network inspect app-network


            # ========================================
            # 30. Deployment complete
            # ========================================

            echo ""
            echo "========================================"
            echo "FRONTEND DEPLOYMENT SUCCESSFUL"
            echo "========================================"
            echo ""

            echo "Streamlit URL:"
            echo "http://YOUR-EC2-PUBLIC-IP:8501"
            echo ""

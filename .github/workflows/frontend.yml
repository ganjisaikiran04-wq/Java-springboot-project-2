name: Build and Deploy Full Application

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1

  BACKEND_REPOSITORY: my-spring-app
  FRONTEND_REPOSITORY: my-streamlit-app

  BACKEND_CONTAINER: my-spring-app
  FRONTEND_CONTAINER: my-streamlit-app

  BACKEND_PORT: 8084
  FRONTEND_PORT: 8501

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout GitHub repository
      # ==================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ==================================================
      # 2. Configure AWS
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 3. Login to ECR
      # ==================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 4. Create Backend ECR repository
      # ==================================================

      - name: Create backend ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$BACKEND_REPOSITORY" \
            --region "$AWS_REGION" \
          || aws ecr create-repository \
            --repository-name "$BACKEND_REPOSITORY" \
            --region "$AWS_REGION"


      # ==================================================
      # 5. Create Frontend ECR repository
      # ==================================================

      - name: Create frontend ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$FRONTEND_REPOSITORY" \
            --region "$AWS_REGION" \
          || aws ecr create-repository \
            --repository-name "$FRONTEND_REPOSITORY" \
            --region "$AWS_REGION"


      # ==================================================
      # 6. Build Backend Docker Image
      # ==================================================

      - name: Build backend Docker image
        run: |
          docker build \
            -t "$BACKEND_REPOSITORY:latest" \
            .


      # ==================================================
      # 7. Tag Backend Image
      # ==================================================

      - name: Tag backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            "$BACKEND_REPOSITORY:latest" \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest"


      # ==================================================
      # 8. Push Backend Image
      # ==================================================

      - name: Push backend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest"


      # ==================================================
      # 9. Build Frontend Docker Image
      # ==================================================

      - name: Build frontend Docker image
        working-directory: frontend
        run: |
          docker build \
            -t "$FRONTEND_REPOSITORY:latest" \
            .


      # ==================================================
      # 10. Tag Frontend Image
      # ==================================================

      - name: Tag frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            "$FRONTEND_REPOSITORY:latest" \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest"


      # ==================================================
      # 11. Push Frontend Image
      # ==================================================

      - name: Push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest"


      # ==================================================
      # 12. Deploy Everything to EC2
      # ==================================================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e


            # ==================================================
            # INSTALL DOCKER
            # ==================================================

            echo "Checking Docker..."

            if ! command -v docker >/dev/null 2>&1
            then

              echo "Docker not found. Installing..."

              if command -v dnf >/dev/null 2>&1
              then
                sudo dnf update -y
                sudo dnf install -y docker

              elif command -v yum >/dev/null 2>&1
              then
                sudo yum update -y
                sudo yum install -y docker

              else
                echo "Unsupported Linux distribution"
                exit 1
              fi

              sudo systemctl enable docker
              sudo systemctl start docker

            else

              echo "Docker already installed."

              sudo systemctl start docker || true

            fi


            # ==================================================
            # INSTALL AWS CLI
            # ==================================================

            echo "Checking AWS CLI..."

            if ! command -v aws >/dev/null 2>&1
            then

              echo "AWS CLI not found. Installing..."

              if command -v dnf >/dev/null 2>&1
              then
                sudo dnf install -y awscli

              elif command -v yum >/dev/null 2>&1
              then
                sudo yum install -y awscli

              else
                echo "Unsupported Linux distribution"
                exit 1
              fi

            else

              echo "AWS CLI already installed."

            fi


            # ==================================================
            # CHECK DOCKER
            # ==================================================

            echo "Docker version:"
            sudo docker --version

            echo "AWS CLI version:"
            aws --version


            # ==================================================
            # LOGIN TO ECR
            # ==================================================

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region ap-southeast-1 \
              | sudo docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}


            # ==================================================
            # PULL BACKEND IMAGE
            # ==================================================

            echo "Pulling backend image..."

            sudo docker pull \
              ${{ steps.login-ecr.outputs.registry }}/my-spring-app:latest


            # ==================================================
            # PULL FRONTEND IMAGE
            # ==================================================

            echo "Pulling frontend image..."

            sudo docker pull \
              ${{ steps.login-ecr.outputs.registry }}/my-streamlit-app:latest


            # ==================================================
            # STOP OLD BACKEND
            # ==================================================

            echo "Stopping old backend..."

            sudo docker stop my-spring-app || true

            sudo docker rm my-spring-app || true


            # ==================================================
            # STOP OLD FRONTEND
            # ==================================================

            echo "Stopping old frontend..."

            sudo docker stop my-streamlit-app || true

            sudo docker rm my-streamlit-app || true


            # ==================================================
            # START BACKEND
            # ==================================================

            echo "Starting backend..."

            sudo docker run -d \
              --name my-spring-app \
              --restart unless-stopped \
              -p 8084:8084 \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
              -e SERVER_PORT="8084" \
              ${{ steps.login-ecr.outputs.registry }}/my-spring-app:latest


            # ==================================================
            # START FRONTEND
            # ==================================================

            echo "Starting frontend..."

            sudo docker run -d \
              --name my-streamlit-app \
              --restart unless-stopped \
              -p 8501:8501 \
              -e API_URL="http://172.31.27.84:8084" \
              ${{ steps.login-ecr.outputs.registry }}/my-streamlit-app:latest


            # ==================================================
            # SHOW CONTAINERS
            # ==================================================

            echo "======================================"
            echo "Running containers"
            echo "======================================"

            sudo docker ps


            # ==================================================
            # BACKEND LOGS
            # ==================================================

            echo "======================================"
            echo "Backend logs"
            echo "======================================"

            sudo docker logs \
              --tail 30 \
              my-spring-app


            # ==================================================
            # FRONTEND LOGS
            # ==================================================

            echo "======================================"
            echo "Frontend logs"
            echo "======================================"

            sudo docker logs \
              --tail 30 \
              my-streamlit-app


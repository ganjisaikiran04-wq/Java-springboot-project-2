name: Build and Deploy Backend

on:
  workflow_dispatch:

  # Uncomment this if you want automatic deployment
  # whenever you push to main.
  #
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: my-spring-app
  CONTAINER_NAME: my-spring-app
  CONTAINER_PORT: 8084

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout source code
      # ============================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================
      # 2. Configure AWS credentials
      # ============================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================
      # 3. Test AWS credentials
      # ============================================

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity


      # ============================================
      # 4. Create ECR repository if it doesn't exist
      # ============================================

      - name: Create ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
          || aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"


      # ============================================
      # 5. Login to Amazon ECR
      # ============================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================
      # 6. Build Backend Docker Image
      #
      # Dockerfile is inside:
      # backend/Dockerfile
      # ============================================

      - name: Build backend Docker image
        working-directory: backend
        run: |
          docker build \
            -t "$ECR_REPOSITORY:latest" \
            .


      # ============================================
      # 7. Tag Docker Image
      # ============================================

      - name: Tag backend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # ============================================
      # 8. Push Docker Image to ECR
      # ============================================

      - name: Push backend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # ============================================
      # 9. Deploy to EC2
      # ============================================

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "========================================"
            echo "Starting EC2 deployment"
            echo "========================================"


            # ========================================
            # Install Docker if not installed
            # ========================================

            echo "Checking Docker..."

            if ! command -v docker >/dev/null 2>&1
            then

              echo "Docker not found. Installing..."

              if command -v dnf >/dev/null 2>&1
              then

                sudo dnf update -y
                sudo dnf install -y docker

              elif command -v yum >/dev/null 2>&1
              then

                sudo yum update -y
                sudo yum install -y docker

              else

                echo "Unsupported Linux distribution."
                exit 1

              fi

              sudo systemctl enable docker
              sudo systemctl start docker

            else

              echo "Docker already installed."

            fi


            # ========================================
            # Start Docker
            # ========================================

            echo "Starting Docker..."

            sudo systemctl start docker


            # ========================================
            # Install AWS CLI if not installed
            # ========================================

            echo "Checking AWS CLI..."

            if ! command -v aws >/dev/null 2>&1
            then

              echo "AWS CLI not found. Installing..."

              if command -v dnf >/dev/null 2>&1
              then

                sudo dnf install -y awscli

              elif command -v yum >/dev/null 2>&1
              then

                sudo yum install -y awscli

              else

                echo "Unsupported Linux distribution."
                exit 1

              fi

            else

              echo "AWS CLI already installed."

            fi


            # ========================================
            # Display versions
            # ========================================

            echo "========================================"
            echo "Docker version"
            echo "========================================"

            sudo docker --version


            echo "========================================"
            echo "AWS CLI version"
            echo "========================================"

            aws --version


            # ========================================
            # Login to ECR
            # ========================================

            echo "========================================"
            echo "Logging into ECR"
            echo "========================================"

            aws ecr get-login-password \
              --region ap-southeast-1 \
              | sudo docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}


            # ========================================
            # Pull latest backend image
            # ========================================

            echo "========================================"
            echo "Pulling backend image"
            echo "========================================"

            sudo docker pull \
              ${{ steps.login-ecr.outputs.registry }}/my-spring-app:latest


            # ========================================
            # Stop old container
            # ========================================

            echo "========================================"
            echo "Stopping old backend container"
            echo "========================================"

            sudo docker stop my-spring-app || true


            # ========================================
            # Remove old container
            # ========================================

            echo "========================================"
            echo "Removing old backend container"
            echo "========================================"

            sudo docker rm my-spring-app || true


            # ========================================
            # Start new backend container
            # ========================================

            echo "========================================"
            echo "Starting backend container"
            echo "========================================"

            sudo docker run -d \
              --name my-spring-app \
              --restart unless-stopped \
              -p 8084:8084 \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
              -e SERVER_PORT="8084" \
              ${{ steps.login-ecr.outputs.registry }}/my-spring-app:latest


            # ========================================
            # Wait for container to start
            # ========================================

            echo "Waiting for application to start..."

            sleep 10


            # ========================================
            # Container status
            # ========================================

            echo "========================================"
            echo "Container status"
            echo "========================================"

            sudo docker ps


            # ========================================
            # Backend logs
            # ========================================

            echo "========================================"
            echo "Backend application logs"
            echo "========================================"

            sudo docker logs \
              --tail 50 \
              my-spring-app


            # ========================================
            # Deployment completed
            # ========================================

            echo "========================================"
            echo "Backend deployment completed"
            echo "========================================"


